<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-HRIS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2><span>❖</span> Mini-HRIS</h2>
            <nav>
                <button class="nav-btn active" data-target="employees">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    Org Chart
                </button>
                <button class="nav-btn" data-target="leave">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Leave Management
                </button>
                <button class="nav-btn" data-target="payroll">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"></path></svg>
                    Payroll
                </button>
            </nav>
        </aside>

        <main class="content">
            <!-- Employees View -->
            <section id="employees" class="view active">
                <header>
                    <h1>Organization</h1>
                </header>
                <div class="card">
                    <table id="employees-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Manager</th>
                                <th>Salary (Annual)</th>
                            </tr>
                        </thead>
                        <tbody id="employees-body">
                            <tr><td colspan="4" class="empty-state">Loading employees...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Leave View -->
            <section id="leave" class="view">
                <header>
                    <h1>Leave Approvals</h1>
                    <button id="new-leave-btn" class="primary-btn">Request Leave</button>
                </header>
                
                <div id="leave-form-container" class="card hidden">
                    <h3>New Request</h3>
                    <form id="leave-form">
                        <div class="form-group">
                            <label>Employee ID</label>
                            <input type="number" id="leave-emp-id" required>
                        </div>
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="leave-start" required>
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" id="leave-end" required>
                        </div>
                        <button type="submit" id="submit-leave-btn" class="primary-btn">Submit Request</button>
                    </form>
                </div>

                <div class="card mt-4">
                    <table id="leave-table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Dates</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="leave-body">
                            <tr><td colspan="4" class="empty-state">Loading requests...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Payroll View -->
            <section id="payroll" class="view">
                <header>
                    <h1>Payroll Generation</h1>
                </header>
                <div class="card">
                    <div class="payroll-controls">
                        <input type="month" id="payroll-period" required>
                        <button id="generate-payroll-btn" class="primary-btn">Run Payroll</button>
                        <button id="view-payroll-btn" class="secondary-btn">View Existing</button>
                    </div>
                </div>

                <div class="card mt-4">
                    <table id="payroll-table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Gross Pay</th>
                                <th>Deductions</th>
                                <th>Net Pay</th>
                            </tr>
                        </thead>
                        <tbody id="payroll-body">
                            <tr><td colspan="4" class="empty-state">Select a period to view payslips.</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <script src="app.js"></script>
</body>
</html>
